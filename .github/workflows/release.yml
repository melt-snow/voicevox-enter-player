name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish (single file, self-contained)
        run: >
          dotnet publish VoicevoxEnterPlayer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Rename executable
        shell: pwsh
        run: >
          Copy-Item
          "bin/Release/net8.0-windows/win-x64/publish/VoicevoxEnterPlayer.exe"
          "VoicevoxEnterPlayer-${{ github.ref_name }}-win-x64.exe"

      - name: Create release and upload
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: VoicevoxEnterPlayer-${{ github.ref_name }}-win-x64.exe
          generate_release_notes: true